<ion-app>
  <ion-menu contentId="main-content" menuId="main-menu" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>SELECT CUTZ</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="full">
        <ion-menu-toggle autoHide="false">
          <ion-item button detail="false" routerLink="/home"><ion-label>Home</ion-label></ion-item>
          <ion-item button detail="false" routerLink="/services"><ion-label>Services</ion-label></ion-item>
          <ion-item button detail="false" routerLink="/gallery"><ion-label>Gallery</ion-label></ion-item>
          <ion-item button detail="false" routerLink="/owner"><ion-label>Meet the Owner</ion-label></ion-item>
          <ion-item button detail="false" routerLink="/booking"><ion-label>Book Appointment</ion-label></ion-item>
          @if (auth.user) {
            <ion-item button detail="false" routerLink="/dashboard"><ion-label>Dashboard</ion-label></ion-item>
            @if (auth.user.type === 'admin') {
              <ion-item button detail="false" routerLink="/admin/services"><ion-label>Manage Services</ion-label></ion-item>
              <ion-item button detail="false" routerLink="/admin/gallery"><ion-label>Manage Gallery</ion-label></ion-item>
              <ion-item button detail="false" routerLink="/admin/site"><ion-label>Logo &amp; Owner</ion-label></ion-item>
              <ion-item button detail="false" routerLink="/admin/reports"><ion-label>Reports</ion-label></ion-item>
            }
            <ion-item button detail="false" (click)="logout()"><ion-label>Logout</ion-label></ion-item>
          } @else {
            <ion-item button detail="false" routerLink="/login"><ion-label>Login</ion-label></ion-item>
            <ion-item button detail="false" routerLink="/register"><ion-label>Register</ion-label></ion-item>
          }
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
