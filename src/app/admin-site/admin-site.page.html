<app-site-header></app-site-header><div class="dashboard-scroll"><div class="dashboard-layout"><aside class="side-nav"><h2>Admin</h2><a routerLink="/dashboard">Dashboard</a><a routerLink="/admin/services">Manage Services</a><a routerLink="/admin/gallery">Gallery</a><a class="active" routerLink="/admin/site">Logo & Owner</a><a routerLink="/admin/reports">Reports</a><button type="button" (click)="logout()">Logout</button></aside><main class="dash"><h1>Logo & Owner</h1><div class="alert error" *ngIf="error">{{error}}</div><div class="alert success" *ngIf="message">{{message}}</div><p class="empty" *ngIf="loading">Loading website details...</p><form *ngIf="site" class="settings-grid box" (ngSubmit)="save()"><label>Website Name<input [(ngModel)]="site.SiteName" name="siteName" required></label><label>Owner Name<input [(ngModel)]="site.OwnerName" name="ownerName"></label><label>Owner Title<input [(ngModel)]="site.OwnerTitle" name="ownerTitle"></label><label>Phone<input [(ngModel)]="site.ContactPhone" name="phone"></label><label>Email<input [(ngModel)]="site.ContactEmail" name="email" type="email"></label><label>Business Hours<input [(ngModel)]="site.BusinessHours" name="hours"></label><label class="wide">Address<input [(ngModel)]="site.Address" name="address"></label><label class="wide">Owner Bio<textarea [(ngModel)]="site.OwnerBio" name="bio"></textarea></label><label>Choose Logo<input type="file" accept="image/jpeg,image/png,image/webp" (change)="choose($event,'logo')"></label><div class="image-preview"><img [src]="logoPreview" alt="Logo preview"><span>Logo preview</span></div><label>Choose Owner Photo<input type="file" accept="image/jpeg,image/png,image/webp" (change)="choose($event,'owner')"></label><div class="image-preview"><img [src]="ownerPreview" alt="Owner preview"><span>Owner photo preview</span></div><ion-button class="wide" type="submit" [disabled]="busy">{{busy?'Saving...':'Save Website Details'}}</ion-button></form></main></div></div>
